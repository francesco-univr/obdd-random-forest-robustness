[project]
name = "obddrf"
version = "0.1.0"
description = "Robustness of a Random-Forest Classifier via OBDD (BDSS project 2025/26)"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
# il distruttore di dd.autoref (dd/bdd.py __del__) lamenta refcount residui
# quando il GC raccoglie manager e Function in ordine arbitrario a fine
# sessione: rumore benigno, non un errore dei test
filterwarnings = ["ignore::pytest.PytestUnraisableExceptionWarning"]
